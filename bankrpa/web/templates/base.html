<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}网银对账 RPA{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         color:#1f2933; background:#f5f7fa; }
  header { background:#163a5f; color:#fff; padding:0 24px; display:flex; align-items:center; gap:24px; }
  header h1 { font-size:18px; margin:14px 0; white-space:nowrap; }
  nav a { color:#cfe0f0; text-decoration:none; margin-right:16px; font-size:14px; }
  nav a:hover { color:#fff; }
  main { max-width:1280px; margin:24px auto; padding:0 20px; }
  h2 { font-size:17px; margin:0 0 14px; }
  .card { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08);
          padding:18px 20px; margin-bottom:20px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border:1px solid #e2e8f0; padding:7px 9px; text-align:left; }
  th { background:#eef2f7; font-weight:600; white-space:nowrap; }
  tr:nth-child(even) td { background:#fafbfd; }
  .btn { display:inline-block; border:0; border-radius:5px; background:#2563a8; color:#fff;
         padding:6px 14px; font-size:13px; cursor:pointer; text-decoration:none; }
  .btn:hover { background:#1d4f88; }
  .btn-gray { background:#64748b; } .btn-gray:hover { background:#475569; }
  .btn-red { background:#b03a3a; } .btn-red:hover { background:#8f2d2d; }
  .btn-sm { padding:3px 9px; font-size:12px; }
  form.inline { display:inline; }
  input, select { padding:6px 8px; border:1px solid #cbd5e1; border-radius:5px; font-size:13px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
  .tag-in { background:#dcf5e7; color:#157347; }
  .tag-out { background:#fde2e1; color:#a33; }
  .tag-success { background:#dcf5e7; color:#157347; }
  .tag-failed { background:#fde2e1; color:#a33; }
  .tag-running { background:#e5edfb; color:#2563a8; }
  .tag-pending { background:#f0f0f0; color:#666; }
  .tag-open { background:#fff1d6; color:#9a6700; }
  .tag-resolved { background:#dcf5e7; color:#157347; }
  .muted { color:#7b8794; font-size:12px; }
  .ok { color:#157347; font-weight:600; } .bad { color:#a33; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
  .kpi { background:#fff; border-radius:8px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .kpi .n { font-size:24px; font-weight:700; margin-top:4px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:14px; }
  .toolbar label { font-size:12px; color:#52606d; display:block; margin-bottom:3px; }
  .error-box { background:#fde2e1; border:1px solid #e6a5a2; color:#8f2d2d;
               padding:16px 18px; border-radius:8px; }
  .amount { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>网银对账 RPA 控制台</h1>
  <nav>
    <a href="/">银行账户</a>
    <a href="/tasks">下载任务</a>
    <a href="/txns">流水库</a>
    <a href="/receivables">应收台账</a>
    <a href="/reconcile">自动对账</a>
    <a href="/diffs">差异处理</a>
    <a href="/report">余额调节表</a>
    <a href="/audit">操作日志</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
